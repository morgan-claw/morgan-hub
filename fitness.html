<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scale=no">
  <title>Fitness — Morgan Hub</title>
  <style>
    :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#222;--border2:#333;--text:#e8e8e8;--muted:#555;--accent:#FF4500;--accent-dim:#FF450020;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--red:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}

    .sidebar{display:none;width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0;flex-direction:column}
    .sidebar .brand{display:flex;align-items:center;gap:0.6rem;padding:0 1.25rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:0.75rem}
    .sidebar .brand .mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;color:#fff}
    .sidebar .brand span{font-weight:600;font-size:1rem}
    .sidebar a{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 1.25rem;color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:color 0.12s,background 0.12s}
    .sidebar a:hover{color:var(--text);background:var(--surface2)}
    .sidebar a.active{color:var(--accent);background:var(--accent-dim)}
    .sidebar a svg{width:18px;height:18px;flex-shrink:0}

    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

    .topbar{display:flex;align-items:center;gap:1rem;padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
    .topbar h1{font-size:1.1rem;font-weight:600;font-family:'SF Mono',SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:1px}
    .topbar .stats{display:flex;gap:1.5rem;margin-left:auto}
    .topbar .stat{text-align:center}
    .topbar .stat .sv{font-size:1.1rem;font-weight:700;font-family:monospace}
    .topbar .stat .sl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .topbar .online{display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:var(--green)}
    .topbar .online::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
    .topbar .clock{font-family:monospace;font-size:0.85rem;color:var(--muted)}
    .topbar .refresh-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0.4rem 0.9rem;font-size:0.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.3rem;transition:background 0.12s}
    .topbar .refresh-btn:hover{background:#e03e00}
    .topbar .refresh-btn:disabled{opacity:0.5;cursor:not-allowed}

    .dashboard{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}

    /* Section headers */
    .section-head{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:0.5rem;display:flex;align-items:center;gap:0.5rem}
    .section-head::after{content:'';flex:1;height:1px;background:var(--border)}

    /* Hero stats row */
    .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0.5rem}
    .hero-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem;text-align:center}
    .hero-stat .val{font-size:1.6rem;font-weight:800;font-family:'SF Mono',monospace;color:var(--accent)}
    .hero-stat .val.green{color:var(--green)}
    .hero-stat .val.blue{color:var(--blue)}
    .hero-stat .val.purple{color:var(--purple)}
    .hero-stat .val.yellow{color:var(--yellow)}
    .hero-stat .lbl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:0.15rem}
    .hero-stat .sub{font-size:0.6rem;margin-top:0.25rem;font-weight:500}
    .trend-up{color:var(--green)}.trend-down{color:var(--red)}.trend-flat{color:var(--muted)}

    /* Volume chart */
    .chart-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem}
    .chart-title{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:0.75rem;text-align:center;font-weight:600}
    .vol-bars{display:flex;align-items:flex-end;gap:0.4rem;height:120px;padding-bottom:18px;position:relative}
    .vol-bar{flex:1;max-width:60px;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;position:relative;cursor:pointer;transition:opacity 0.12s}
    .vol-bar:hover{opacity:0.7}
    .vol-bar::after{content:attr(data-label);position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:0.55rem;color:var(--muted);white-space:nowrap}
    .vol-bar .tip{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:var(--text);font-weight:600;white-space:nowrap;opacity:0;transition:opacity 0.12s}
    .vol-bar:hover .tip{opacity:1}
    .vol-bar.current{background:var(--green)}

    /* Two-column panels */
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
    @media(max-width:700px){.two-col{grid-template-columns:1fr}}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem;display:flex;flex-direction:column}
    .panel-title{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:0.5rem;font-weight:600}

    /* Muscle bars */
    .muscle-row{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.4rem;font-size:0.75rem}
    .muscle-name{width:65px;flex-shrink:0;color:var(--muted);font-weight:500}
    .muscle-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
    .muscle-fill{height:100%;border-radius:3px;transition:width 0.3s}
    .muscle-ct{color:var(--text);font-family:monospace;font-size:0.65rem;width:24px;text-align:right;font-weight:600}

    /* PR rows */
    .pr-row{display:flex;align-items:center;justify-content:space-between;padding:0.35rem 0;font-size:0.75rem;border-bottom:1px solid rgba(255,255,255,0.03)}
    .pr-row:last-child{border-bottom:none}
    .pr-name{color:var(--text);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pr-val{color:var(--accent);font-family:monospace;font-weight:700;flex-shrink:0;margin-left:0.5rem}
    .pr-date{font-size:0.6rem;color:var(--muted);margin-left:0.4rem;flex-shrink:0}
    .pr-new{background:var(--accent-dim);color:var(--accent);font-size:0.55rem;font-weight:600;padding:1px 4px;border-radius:3px;margin-left:0.3rem}

    /* Frequency heatmap */
    .freq-grid{display:flex;gap:3px;flex-wrap:wrap}
    .freq-day{width:16px;height:16px;border-radius:3px;background:var(--surface2);border:1px solid var(--border);position:relative}
    .freq-day.hit{background:var(--accent);border-color:var(--accent)}
    .freq-day.today{outline:2px solid var(--green);outline-offset:1px}
    .freq-day:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:2px 6px;border-radius:4px;font-size:0.55rem;white-space:nowrap;color:var(--text);z-index:10}

    /* Scrollable list sections */
    .scroll-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:0.35rem;padding-right:0.25rem}
    .scroll-list::-webkit-scrollbar{width:4px}
    .scroll-list::-webkit-scrollbar-track{background:transparent}
    .scroll-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

    .card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.65rem;cursor:pointer;transition:border-color 0.12s}
    .card:hover{border-color:var(--accent)}
    .workout-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.15rem}
    .workout-title{font-size:0.78rem;font-weight:500;line-height:1.3}
    .workout-date{font-size:0.65rem;color:var(--muted);font-family:monospace}
    .workout-tags{display:flex;gap:0.25rem;flex-wrap:wrap;margin-top:0.2rem}
    .workout-tag{font-size:0.58rem;padding:1px 5px;border-radius:3px;font-weight:500;background:var(--surface2);color:var(--muted)}
    .workout-tag.dur{background:#3b82f620;color:var(--blue)}
    .workout-tag.vol{background:var(--accent-dim);color:var(--accent)}
    .workout-tag.ex{background:#22c55e20;color:var(--green)}
    .workout-exercises{display:none;margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)}
    .card.expanded .workout-exercises{display:block}
    .ex-row{display:flex;align-items:baseline;justify-content:space-between;padding:0.15rem 0;font-size:0.7rem}
    .ex-row:not(:last-child){border-bottom:1px solid rgba(255,255,255,0.03)}
    .ex-name{color:var(--text);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ex-detail{color:var(--muted);font-family:monospace;font-size:0.65rem;flex-shrink:0;margin-left:0.5rem}

    .routine-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.65rem;transition:border-color 0.12s}
    .routine-card:hover{border-color:var(--accent)}
    .routine-name{font-size:0.78rem;font-weight:500;margin-bottom:0.2rem}
    .routine-exercises{font-size:0.65rem;color:var(--muted);line-height:1.4}

    /* Consistency score */
    .consistency{display:flex;align-items:center;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem 1rem}
    .consistency-ring{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
    .consistency-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
    .consistency-ring .ring-val{font-size:1.1rem;font-weight:800;font-family:monospace;z-index:1}
    .consistency-info{flex:1}
    .consistency-label{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .consistency-detail{font-size:0.75rem;color:var(--text);margin-top:0.15rem}

    .empty-state{text-align:center;padding:2rem;color:var(--muted);font-size:0.8rem}
    .error-state{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--red);border-radius:8px;padding:0.6rem;text-align:center;font-size:0.8rem;margin:0.75rem}
    .loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 0.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    .tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0);z-index:100}
    .tab-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;text-decoration:none;color:var(--muted);font-size:0.7rem;font-weight:500}
    .tab-bar a.active{color:var(--accent)}
    .tab-bar a svg{width:22px;height:22px}

    @media(min-width:768px){.sidebar{display:flex}.tab-bar{display:none}}
    @media(max-width:767px){.dashboard{padding-bottom:70px}}
    @media(max-width:600px){
      .topbar{flex-wrap:wrap;gap:0.5rem}
      .topbar .stats{gap:0.75rem}
      .hero-stats{grid-template-columns:repeat(2,1fr)}
    }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <aside class="sidebar"></aside>

  <div class="main">
    <div class="topbar">
      <h1>Fitness</h1>
      <div class="stats">
        <div class="stat"><div class="sv" id="statTotal">-</div><div class="sl">Workouts</div></div>
        <div class="stat"><div class="sv" id="statWeek">-</div><div class="sl">This Week</div></div>
        <div class="stat"><div class="sv" id="statStreak">-</div><div class="sl">Streak</div></div>
      </div>
      <span class="clock" id="clock"></span>
      <span class="online">ONLINE</span>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="dashboard">
      <div id="errorContainer"></div>
      <div id="loadingState" class="empty-state"><div class="loading-spinner"></div>Loading from Hevy...</div>

      <!-- Progress & Goals -->
      <div id="dashContent" style="display:none">

        <!-- Consistency Score + Frequency -->
        <div class="section-head">Consistency</div>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
          <div class="consistency" style="flex:1;min-width:240px">
            <div class="consistency-ring" id="consistencyRing">
              <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="var(--border)" stroke-width="5"/><circle id="ringCircle" cx="32" cy="32" r="28" fill="none" stroke="var(--green)" stroke-width="5" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="176"/></svg>
              <span class="ring-val" id="consistencyVal">-</span>
            </div>
            <div class="consistency-info">
              <div class="consistency-label">Weekly Consistency (4wk)</div>
              <div class="consistency-detail" id="consistencyDetail">-</div>
            </div>
          </div>
          <div class="panel" style="flex:1.3;min-width:280px">
            <div class="panel-title">Last 28 Days</div>
            <div class="freq-grid" id="freqGrid"></div>
          </div>
        </div>

        <!-- Hero Stats -->
        <div class="section-head">Progress Snapshot</div>
        <div class="hero-stats" id="heroStats"></div>

        <!-- Volume Trend -->
        <div class="section-head">Volume Trend</div>
        <div class="chart-box">
          <div class="chart-title">Weekly Total Volume (kg) — 8 Weeks</div>
          <div class="vol-bars" id="volChart"></div>
        </div>

        <!-- Muscle Focus + PRs -->
        <div class="section-head">Strength & Balance</div>
        <div class="two-col">
          <div class="panel">
            <div class="panel-title">Muscle Group Focus (Recent 10)</div>
            <div id="musclePanel"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Personal Records</div>
            <div id="prPanel"></div>
          </div>
        </div>

        <!-- Recent Workouts -->
        <div class="section-head">Recent Workouts</div>
        <div class="scroll-list" id="workoutsList"></div>

        <!-- Routines -->
        <div class="section-head">Routines</div>
        <div class="scroll-list" id="routinesList"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  // Clock
  function updateClock(){
    var d=new Date();
    document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{timeZone:'America/Toronto',hour12:false})
      +' '+d.toLocaleDateString('en-US',{timeZone:'America/Toronto',weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  }
  setInterval(updateClock,1000);updateClock();

  // Helpers
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
  function getWeekStart(d){var dt=new Date(d);dt.setHours(0,0,0,0);var day=dt.getDay();dt.setDate(dt.getDate()-(day===0?6:day-1));return dt}
  function fmtWeight(kg){var lbs=kg*2.20462;return lbs>=100?Math.round(lbs)+'lb':lbs.toFixed(1)+'lb'}
  function fmtDur(s,e){if(!s||!e)return'-';var m=Math.round((new Date(e)-new Date(s))/60000);return m>=60?Math.floor(m/60)+'h'+m%60+'m':m+'m'}
  function calcVol(w){var v=0;(w.exercises||[]).forEach(function(ex){(ex.sets||[]).forEach(function(s){if(s.reps&&s.weight_kg)v+=s.reps*s.weight_kg})});return v}
  function fmtVol(v){return v>=10000?(v/1000).toFixed(0)+'k':v>=1000?(v/1000).toFixed(1)+'k':v.toString()}

  var state={workouts:[],routines:[],loaded:false,loading:false};

  async function callHevyAPI(tool,params){
    var routeMap={'hevy.get_workouts':'workouts','hevy.get_routines':'routines','hevy.get_exercise_templates':'exercises','hevy.get_workout_count':'workout-count'};
    var route=routeMap[tool]||'workouts';
    var query=new URLSearchParams(params||{});
    var r=await fetch('/api/hevy/'+route+'?'+query);
    if(!r.ok)throw new Error('HTTP '+r.status+': '+await r.text());
    return await r.json();
  }

  // Muscle map
  var MUSCLE_MAP={'squat':['Quads','Glutes'],'bench':['Chest','Triceps'],'deadlift':['Back','Hamstrings'],'press':['Shoulders','Triceps'],'row':['Back','Biceps'],'curl':['Biceps'],'pull':['Back','Biceps'],'pulldown':['Back','Biceps'],'fly':['Chest'],'raise':['Shoulders'],'extension':['Triceps'],'lunge':['Quads','Glutes'],'calf':['Calves'],'shrug':['Traps'],'dip':['Chest','Triceps'],'lat':['Back'],'incline':['Chest','Shoulders'],'cable':['Chest'],'hammer':['Biceps'],'skull':['Triceps']};
  var MUSCLE_COLORS={'Chest':'#ef4444','Back':'#3b82f6','Quads':'#22c55e','Shoulders':'#f59e0b','Biceps':'#8b5cf6','Triceps':'#ec4899','Glutes':'#14b8a6','Hamstrings':'#06b6d4','Calves':'#84cc16','Traps':'#f97316'};

  function getMuscles(workouts){
    var g={};
    workouts.forEach(function(w){(w.exercises||[]).forEach(function(ex){
      var t=ex.title.toLowerCase();
      Object.keys(MUSCLE_MAP).forEach(function(k){if(t.includes(k))MUSCLE_MAP[k].forEach(function(m){g[m]=(g[m]||0)+(ex.sets?ex.sets.length:0)})});
    })});
    return Object.entries(g).sort(function(a,b){return b[1]-a[1]});
  }

  function getPRs(){
    var prs={};
    state.workouts.forEach(function(w){(w.exercises||[]).forEach(function(ex){(ex.sets||[]).forEach(function(s){
      if(s.reps&&s.weight_kg){
        var key=ex.title;
        if(!prs[key]||s.weight_kg>prs[key].weight)prs[key]={weight:s.weight_kg,reps:s.reps,date:w.start_time};
      }
    })})});
    return Object.entries(prs).sort(function(a,b){return b[1].weight-a[1].weight});
  }

  function getWeeklyVolumes(){
    var now=new Date(),ws=getWeekStart(now),weeks=[];
    for(var i=7;i>=0;i--){
      var s=new Date(ws);s.setDate(s.getDate()-i*7);
      var e=new Date(s);e.setDate(e.getDate()+6);
      var ww=state.workouts.filter(function(w){var d=new Date(w.start_time);return d>=s&&d<=e});
      weeks.push({volume:ww.reduce(function(sum,w){return sum+calcVol(w)},0),label:s.toLocaleDateString('en-US',{month:'short',day:'numeric'}),count:ww.length,isCurrent:i===0});
    }
    return weeks;
  }

  // Load
  window.loadData=async function(){
    if(state.loading)return;
    state.loading=true;
    var btn=document.getElementById('refreshBtn');
    btn.textContent='Loading...';btn.disabled=true;
    document.getElementById('errorContainer').innerHTML='';
    try{
      var [w1,w2,w3,rt]=await Promise.all([
        callHevyAPI('hevy.get_workouts',{page:1,pageSize:10}),
        callHevyAPI('hevy.get_workouts',{page:2,pageSize:10}),
        callHevyAPI('hevy.get_workouts',{page:3,pageSize:10}),
        callHevyAPI('hevy.get_routines',{page:1,pageSize:10})
      ]);
      state.workouts=[...(w1.workouts||[]),...(w2.workouts||[]),...(w3.workouts||[])];
      state.routines=rt.routines||[];
      state.loaded=true;state.loading=false;
      btn.textContent='Refresh';btn.disabled=false;
      document.getElementById('loadingState').style.display='none';
      document.getElementById('dashContent').style.display='';
      renderAll();
    }catch(e){
      console.error('Load failed:',e);
      document.getElementById('errorContainer').innerHTML='<div class="error-state">Failed to load: '+esc(e.message)+'</div>';
      document.getElementById('loadingState').style.display='none';
      state.loading=false;btn.textContent='Retry';btn.disabled=false;
    }
  };
  document.getElementById('refreshBtn').onclick=loadData;

  function renderAll(){
    if(!state.loaded)return;
    renderTopStats();
    renderConsistency();
    renderFreqGrid();
    renderHeroStats();
    renderVolChart();
    renderMuscles();
    renderPRs();
    renderWorkouts();
    renderRoutines();
  }

  // Top bar
  function renderTopStats(){
    var ws=state.workouts;if(!ws.length)return;
    var now=new Date(),weekStart=getWeekStart(now);
    var thisWeek=ws.filter(function(w){return new Date(w.start_time)>=weekStart});
    var streak=0,check=new Date(weekStart);
    for(var i=0;i<12;i++){
      var s=new Date(check),e=new Date(check);e.setDate(e.getDate()+6);
      if(ws.some(function(w){var d=new Date(w.start_time);return d>=s&&d<=e}))streak++;else break;
      check.setDate(check.getDate()-7);
    }
    document.getElementById('statTotal').textContent=ws.length;
    document.getElementById('statWeek').textContent=thisWeek.length;
    document.getElementById('statStreak').textContent=streak+'w';
  }

  // Consistency ring
  function renderConsistency(){
    var ws=state.workouts;if(!ws.length)return;
    var TARGET=4; // target sessions per week
    var now=new Date(),weekStart=getWeekStart(now);
    var weeksData=[];
    for(var i=0;i<4;i++){
      var s=new Date(weekStart);s.setDate(s.getDate()-i*7);
      var e=new Date(s);e.setDate(e.getDate()+6);
      var cnt=ws.filter(function(w){var d=new Date(w.start_time);return d>=s&&d<=e}).length;
      weeksData.push(cnt);
    }
    var avgPerWeek=weeksData.reduce(function(a,b){return a+b},0)/4;
    var pct=Math.min(100,Math.round(avgPerWeek/TARGET*100));
    var circumference=2*Math.PI*28; // ~176
    var offset=circumference-circumference*pct/100;
    document.getElementById('ringCircle').style.strokeDashoffset=offset;
    document.getElementById('ringCircle').style.stroke=pct>=80?'var(--green)':pct>=50?'var(--yellow)':'var(--red)';
    document.getElementById('consistencyVal').textContent=pct+'%';
    document.getElementById('consistencyDetail').textContent=avgPerWeek.toFixed(1)+' sessions/wk avg (target: '+TARGET+') — '+weeksData.map(function(c){return c+'x'}).join(', ');
  }

  // Frequency heatmap
  function renderFreqGrid(){
    var ws=state.workouts;
    var grid=document.getElementById('freqGrid');
    var today=new Date();today.setHours(0,0,0,0);
    var todayStr=today.toISOString().slice(0,10);
    var cells=[];
    for(var i=27;i>=0;i--){
      var d=new Date(today);d.setDate(d.getDate()-i);
      var dk=d.toISOString().slice(0,10);
      var hit=ws.some(function(w){return w.start_time&&w.start_time.slice(0,10)===dk});
      var dayName=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      var cls='freq-day'+(hit?' hit':'')+(dk===todayStr?' today':'');
      cells.push('<div class="'+cls+'" data-tip="'+dayName+(hit?' ✓':'')+'"></div>');
    }
    grid.innerHTML=cells.join('');
  }

  // Hero stats
  function renderHeroStats(){
    var ws=state.workouts;if(!ws.length)return;
    var now=new Date(),weekStart=getWeekStart(now),monthStart=new Date(now.getFullYear(),now.getMonth(),1);
    var thisWeek=ws.filter(function(w){return new Date(w.start_time)>=weekStart});
    var prevWeekStart=new Date(weekStart);prevWeekStart.setDate(prevWeekStart.getDate()-7);
    var prevWeek=ws.filter(function(w){var d=new Date(w.start_time);return d>=prevWeekStart&&d<weekStart});
    var thisMonth=ws.filter(function(w){return new Date(w.start_time)>=monthStart});

    var weekVol=thisWeek.reduce(function(s,w){return s+calcVol(w)},0);
    var prevVol=prevWeek.reduce(function(s,w){return s+calcVol(w)},0);
    var volDiff=prevVol?Math.round((weekVol-prevVol)/prevVol*100):0;

    var totalVol=ws.reduce(function(s,w){return s+calcVol(w)},0);
    var avgDur=Math.round(ws.reduce(function(s,w){return w.start_time&&w.end_time?s+(new Date(w.end_time)-new Date(w.start_time))/60000:s},0)/ws.length);
    var avgEx=Math.round(ws.reduce(function(s,w){return s+(w.exercises?w.exercises.length:0)},0)/ws.length);

    var weekDiff=thisWeek.length-prevWeek.length;
    var weekTrend=weekDiff>0?'trend-up':weekDiff<0?'trend-down':'trend-flat';
    var volTrend=volDiff>0?'trend-up':volDiff<0?'trend-down':'trend-flat';

    document.getElementById('heroStats').innerHTML=
      '<div class="hero-stat"><div class="val green">'+thisWeek.length+'</div><div class="lbl">This Week</div><div class="sub '+weekTrend+'">'+(weekDiff>0?'+':'')+weekDiff+' vs last</div></div>'
      +'<div class="hero-stat"><div class="val">'+fmtVol(weekVol)+'kg</div><div class="lbl">Week Volume</div><div class="sub '+volTrend+'">'+(volDiff>0?'+':'')+volDiff+'% vs last</div></div>'
      +'<div class="hero-stat"><div class="val blue">'+thisMonth.length+'</div><div class="lbl">This Month</div></div>'
      +'<div class="hero-stat"><div class="val purple">'+fmtVol(totalVol)+'kg</div><div class="lbl">Total Volume</div></div>'
      +'<div class="hero-stat"><div class="val yellow">'+avgDur+'m</div><div class="lbl">Avg Duration</div></div>'
      +'<div class="hero-stat"><div class="val">'+avgEx+'</div><div class="lbl">Avg Exercises</div></div>';
  }

  // Volume chart
  function renderVolChart(){
    var weeks=getWeeklyVolumes();
    var maxV=Math.max.apply(null,weeks.map(function(w){return w.volume}))||1;
    document.getElementById('volChart').innerHTML=weeks.map(function(w){
      var h=Math.max(3,w.volume/maxV*100);
      return '<div class="vol-bar'+(w.isCurrent?' current':'')+'" style="height:'+h+'px" data-label="'+w.label+'"><span class="tip">'+fmtVol(w.volume)+'kg ('+w.count+'x)</span></div>';
    }).join('');
  }

  // Muscles
  function renderMuscles(){
    var muscles=getMuscles(state.workouts.slice(0,10)).slice(0,8);
    var maxM=muscles.length?muscles[0][1]:1;
    document.getElementById('musclePanel').innerHTML=muscles.length?muscles.map(function(m){
      var color=MUSCLE_COLORS[m[0]]||'var(--accent)';
      return '<div class="muscle-row"><span class="muscle-name">'+m[0]+'</span><div class="muscle-track"><div class="muscle-fill" style="width:'+Math.round(m[1]/maxM*100)+'%;background:'+color+'"></div></div><span class="muscle-ct">'+m[1]+'</span></div>';
    }).join(''):'<div style="color:var(--muted);font-size:0.7rem">No data</div>';
  }

  // PRs
  function renderPRs(){
    var prs=getPRs().slice(0,8);
    document.getElementById('prPanel').innerHTML=prs.length?prs.map(function(p){
      var dt=new Date(p[1].date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      var isNew=new Date(p[1].date)>new Date(Date.now()-7*86400000);
      return '<div class="pr-row"><span class="pr-name">'+esc(p[0])+'</span><span class="pr-val">'+p[1].reps+'×'+fmtWeight(p[1].weight)+'</span><span class="pr-date">'+dt+'</span>'+(isNew?'<span class="pr-new">NEW</span>':'')+'</div>';
    }).join(''):'<div style="color:var(--muted);font-size:0.7rem">No data</div>';
  }

  // Workouts list
  function renderWorkouts(){
    var c=document.getElementById('workoutsList');
    var ws=state.workouts.slice(0,15);
    if(!ws.length){c.innerHTML='<div class="empty-state">No workouts</div>';return}
    c.innerHTML=ws.map(function(w){
      var dt=new Date(w.start_time);
      var dateStr=dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
      var timeStr=dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      var dur=fmtDur(w.start_time,w.end_time);
      var exs=w.exercises||[];
      var vol=calcVol(w);
      return '<div class="card" onclick="this.classList.toggle(\'expanded\')">'
        +'<div class="workout-header"><span class="workout-title">'+esc(w.title)+'</span><span class="workout-date">'+dateStr+' '+timeStr+'</span></div>'
        +'<div class="workout-tags">'
        +'<span class="workout-tag dur">'+dur+'</span>'
        +'<span class="workout-tag ex">'+exs.length+' exercises</span>'
        +(vol?'<span class="workout-tag vol">'+fmtVol(vol)+'kg</span>':'')
        +'</div>'
        +'<div class="workout-exercises">'
        +exs.map(function(ex){
          var sets=ex.sets||[];
          var best=sets.reduce(function(b,s){return s.weight_kg>b.w?{w:s.weight_kg,r:s.reps}:b},{w:0,r:0});
          return '<div class="ex-row"><span class="ex-name">'+esc(ex.title)+'</span><span class="ex-detail">'+sets.length+'s'+(best.w?' / '+best.r+'×'+fmtWeight(best.w):'')+'</span></div>';
        }).join('')
        +'</div></div>';
    }).join('');
  }

  // Routines list
  function renderRoutines(){
    var c=document.getElementById('routinesList');
    var rs=state.routines;
    if(!rs.length){c.innerHTML='<div class="empty-state">No routines</div>';return}
    c.innerHTML=rs.map(function(r){
      var exs=r.exercises||[];
      var exList=exs.slice(0,5).map(function(e){return esc(e.title)}).join(', ');
      if(exs.length>5)exList+=' + '+(exs.length-5)+' more';
      return '<div class="routine-card">'
        +'<div class="routine-name">'+esc(r.title)+'</div>'
        +'<div class="routine-exercises">'+exList+'</div>'
        +'</div>';
    }).join('');
  }

  setTimeout(loadData,500);
})();
</script>
