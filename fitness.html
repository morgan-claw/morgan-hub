<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitness — Morgan Hub</title>
  <style>
    :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#222;--border2:#333;--text:#e8e8e8;--muted:#555;--accent:#FF4500;--accent-dim:#FF450020;--green:#22c55e;--yellow:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;--red:#ef4444}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}

    /* Sidebar */
    .sidebar{display:none;width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 0;flex-direction:column}
    .sidebar .brand{display:flex;align-items:center;gap:0.6rem;padding:0 1.25rem 1.25rem;border-bottom:1px solid var(--border);margin-bottom:0.75rem}
    .sidebar .brand .mark{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;color:#fff}
    .sidebar .brand span{font-weight:600;font-size:1rem}
    .sidebar a{display:flex;align-items:center;gap:0.6rem;padding:0.55rem 1.25rem;color:var(--muted);text-decoration:none;font-size:0.85rem;font-weight:500;transition:color 0.12s,background 0.12s}
    .sidebar a:hover{color:var(--text);background:var(--surface2)}
    .sidebar a.active{color:var(--accent);background:var(--accent-dim)}
    .sidebar a svg{width:18px;height:18px;flex-shrink:0}

    /* Main area */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}

    /* Top bar */
    .topbar{display:flex;align-items:center;gap:1rem;padding:0.75rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
    .topbar h1{font-size:1.1rem;font-weight:600;font-family:'SF Mono',SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:1px}
    .topbar .stats{display:flex;gap:1.5rem;margin-left:auto}
    .topbar .stat{text-align:center}
    .topbar .stat .sv{font-size:1.1rem;font-weight:700;font-family:monospace}
    .topbar .stat .sl{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
    .topbar .online{display:flex;align-items:center;gap:0.3rem;font-size:0.75rem;color:var(--green)}
    .topbar .online::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
    .topbar .clock{font-family:monospace;font-size:0.85rem;color:var(--muted)}
    .topbar .refresh-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0.4rem 0.9rem;font-size:0.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.3rem;transition:background 0.12s}
    .topbar .refresh-btn:hover{background:#e03e00}
    .topbar .refresh-btn:disabled{opacity:0.5;cursor:not-allowed}

    /* Tabs */
    .tab-nav{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
    .tab-nav button{background:none;border:none;color:var(--muted);font-size:0.8rem;font-weight:600;padding:0.7rem 1.25rem;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid transparent;transition:all 0.15s}
    .tab-nav button:hover{color:var(--text)}
    .tab-nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

    /* Content */
    .content{flex:1;overflow-y:auto;padding:0.75rem}
    .tab-panel{display:none}
    .tab-panel.active{display:block}

    /* Cards */
    .card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.7rem;cursor:pointer;transition:border-color 0.12s;margin-bottom:0.5rem}
    .card:hover{border-color:var(--accent)}

    /* Workout card */
    .workout-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem}
    .workout-title{font-size:0.85rem;font-weight:600}
    .workout-date{font-size:0.7rem;color:var(--muted);font-family:monospace}
    .workout-meta{display:flex;gap:1rem;font-size:0.7rem;color:var(--muted);margin-bottom:0.3rem}
    .workout-exercises{display:none;margin-top:0.5rem;padding-top:0.5rem;border-top:1px solid var(--border)}
    .card.expanded .workout-exercises{display:block}
    .exercise-table{width:100%;border-collapse:collapse;font-size:0.75rem}
    .exercise-table th{text-align:left;color:var(--muted);font-weight:500;padding:0.3rem 0.5rem;text-transform:uppercase;font-size:0.65rem;letter-spacing:0.3px;border-bottom:1px solid var(--border)}
    .exercise-table td{padding:0.3rem 0.5rem;font-family:monospace;font-size:0.75rem}
    .exercise-table tr:not(:last-child) td{border-bottom:1px solid rgba(255,255,255,0.03)}
    .expand-hint{font-size:0.6rem;color:var(--muted);text-align:right;margin-top:0.2rem}

    /* Routine card */
    .routine-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.7rem;transition:border-color 0.12s;margin-bottom:0.5rem}
    .routine-card:hover{border-color:var(--accent)}
    .routine-name{font-size:0.85rem;font-weight:600;margin-bottom:0.3rem}
    .routine-meta{display:flex;gap:1rem;font-size:0.7rem;color:var(--muted)}

    /* Routines grid */
    .routines-list{display:grid;grid-template-columns:1fr;gap:0.5rem}
    @media(min-width:640px){.routines-list{grid-template-columns:repeat(2,1fr)}}

    /* Stats tab */
    .stats-section{margin-bottom:1.5rem}
    .stats-section h3{font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:0.75rem}
    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.5rem}
    @media(min-width:520px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
    .stat-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.75rem;text-align:center}
    .stat-card .sv{font-size:1.5rem;font-weight:700;color:var(--accent);font-family:monospace}
    .stat-card .sl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-top:0.2rem}

    /* Volume chart */
    .chart-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem}
    .chart-title{font-size:0.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:0.75rem;text-align:center}
    .volume-chart{display:flex;align-items:flex-end;justify-content:center;gap:0.4rem;height:120px;padding:0 0.5rem}
    .volume-bar{flex:1;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0;min-height:4px;position:relative;transition:opacity 0.15s;cursor:pointer}
    .volume-bar:hover{opacity:0.8}
    .volume-bar::after{content:attr(data-week);position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:var(--muted);white-space:nowrap}
    .volume-bar::before{content:attr(data-volume);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:var(--text);white-space:nowrap;opacity:0;transition:opacity 0.15s}
    .volume-bar:hover::before{opacity:1}

    /* Muscle groups */
    .muscle-item{display:flex;align-items:center;padding:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:0.4rem}
    .muscle-name{font-size:0.8rem;font-weight:600;width:80px;flex-shrink:0}
    .muscle-bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;margin:0 0.75rem;overflow:hidden}
    .muscle-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.4s ease}
    .muscle-count{font-size:0.75rem;color:var(--accent);font-weight:600;font-family:monospace;min-width:24px;text-align:right}

    /* PR list */
    .pr-item{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.7rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:0.4rem}
    .pr-item:hover{border-color:var(--accent)}
    .pr-exercise{font-size:0.8rem;font-weight:600;flex:1}
    .pr-weight{font-size:0.9rem;font-weight:700;color:var(--accent);font-family:monospace}
    .pr-date{font-size:0.65rem;color:var(--muted);margin-left:0.75rem}
    .pr-badge{padding:0.15rem 0.4rem;background:var(--accent-dim);color:var(--accent);border-radius:4px;font-size:0.6rem;font-weight:600;margin-left:0.5rem}

    /* Empty / Error / Loading */
    .empty-state{text-align:center;padding:2rem;color:var(--muted);font-size:0.8rem}
    .error-state{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--red);border-radius:8px;padding:0.75rem;text-align:center;font-size:0.8rem;margin-bottom:0.75rem}
    .loading-spinner{width:24px;height:24px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 0.5rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Modal */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center}
    .modal-bg.show{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:90%;max-width:550px;max-height:80vh;overflow-y:auto;padding:1.5rem}
    .modal h2{font-size:1rem;font-weight:600;margin-bottom:1rem}
    .modal .btn-row{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.75rem}
    .modal .btn{padding:0.4rem 0.9rem;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;border:none;transition:background 0.12s}
    .modal .btn.ghost{background:none;color:var(--muted);border:1px solid var(--border)}
    .modal .btn.ghost:hover{color:var(--text)}

    /* Mobile bottom tabs */
    .tab-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0);z-index:100}
    .tab-bar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;text-decoration:none;color:var(--muted);font-size:0.7rem;font-weight:500}
    .tab-bar a.active{color:var(--accent)}
    .tab-bar a svg{width:22px;height:22px}

    @media(min-width:768px){
      .sidebar{display:flex}
      .tab-bar{display:none}
    }
    @media(max-width:767px){
      .content{padding-bottom:70px}
    }
    @media(max-width:600px){
      .topbar{flex-wrap:wrap;gap:0.5rem}
      .topbar .stats{gap:0.75rem}
    }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <aside class="sidebar"></aside>

  <div class="main">
    <div class="topbar">
      <h1>Fitness</h1>
      <div class="stats">
        <div class="stat"><div class="sv" id="statTotal">-</div><div class="sl">Total</div></div>
        <div class="stat"><div class="sv" id="statWeek">-</div><div class="sl">This Week</div></div>
        <div class="stat"><div class="sv" id="statStreak">-</div><div class="sl">Streak</div></div>
        <div class="stat"><div class="sv" id="statAvg">-</div><div class="sl">Avg Min</div></div>
      </div>
      <span class="clock" id="clock"></span>
      <span class="online">ONLINE</span>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="tab-nav">
      <button class="active" data-tab="workouts">Workouts</button>
      <button data-tab="routines">Routines</button>
      <button data-tab="stats">Stats</button>
    </div>

    <div class="content">
      <div id="errorContainer"></div>

      <!-- Workouts Tab -->
      <div class="tab-panel active" id="panel-workouts">
        <div id="workoutsContainer">
          <div class="empty-state"><div class="loading-spinner"></div>Loading workouts...</div>
        </div>
      </div>

      <!-- Routines Tab -->
      <div class="tab-panel" id="panel-routines">
        <div class="routines-list" id="routinesContainer">
          <div class="empty-state">Loading routines...</div>
        </div>
      </div>

      <!-- Stats Tab -->
      <div class="tab-panel" id="panel-stats">
        <div class="stats-section">
          <h3>Overview</h3>
          <div class="stats-grid" id="statsOverview">
            <div class="empty-state">Load data to see stats</div>
          </div>
        </div>
        <div class="stats-section">
          <h3>Weekly Volume</h3>
          <div class="chart-box">
            <div class="chart-title">Volume (kg) — Last 8 Weeks</div>
            <div id="volumeChart"><div class="volume-chart"><div class="empty-state">No data</div></div></div>
          </div>
        </div>
        <div class="stats-section">
          <h3>Muscle Focus</h3>
          <div id="muscleGroups"><div class="empty-state">No data</div></div>
        </div>
        <div class="stats-section">
          <h3>Personal Records</h3>
          <div id="prList"><div class="empty-state">No data</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Workout Detail Modal -->
  <div class="modal-bg" id="workoutModal">
    <div class="modal" id="workoutModalContent"></div>
  </div>

<script>
(function(){
  // ---- Clock ----
  function updateClock(){
    var d=new Date();
    document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{timeZone:'America/Toronto',hour12:false})
      +' '+d.toLocaleDateString('en-US',{timeZone:'America/Toronto',weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  }
  setInterval(updateClock,1000);
  updateClock();

  // ---- Tabs ----
  document.querySelectorAll('.tab-nav button').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('.tab-nav button').forEach(function(b){b.classList.remove('active')});
      document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });

  // ---- Modal ----
  function closeModal(id){document.getElementById(id).classList.remove('show')}
  document.querySelectorAll('.modal-bg').forEach(function(el){
    el.addEventListener('click',function(e){if(e.target===el)el.classList.remove('show')});
  });

  // ---- Helpers ----
  function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
  function getWeekStart(d){var dt=new Date(d);dt.setHours(0,0,0,0);var day=dt.getDay();var diff=day===0?6:day-1;dt.setDate(dt.getDate()-diff);return dt}

  function formatWeight(kg){var lbs=kg*2.20462;return lbs>=100?Math.round(lbs)+'lb':lbs.toFixed(1)+'lb'}
  function formatDuration(s,e){if(!s||!e)return'-';var m=Math.round((new Date(e)-new Date(s))/60000);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'min'}
  function calculateVolume(w){var v=0;(w.exercises||[]).forEach(function(ex){(ex.sets||[]).forEach(function(s){if(s.reps&&s.weight_kg)v+=s.reps*s.weight_kg})});return v}

  // ---- State ----
  var state={workouts:[],routines:[],loaded:false,loading:false};

  // ---- API ----
  async function callHevyAPI(tool,params){
    var routeMap={'hevy.get_workouts':'workouts','hevy.get_routines':'routines','hevy.get_exercise_templates':'exercises','hevy.get_workout_count':'workout-count'};
    var route=routeMap[tool]||'workouts';
    var query=new URLSearchParams(params||{});
    var r=await fetch('/api/hevy/'+route+'?'+query);
    if(!r.ok)throw new Error('HTTP '+r.status+': '+await r.text());
    return await r.json();
  }

  // ---- Load ----
  window.loadData=async function(){
    if(state.loading)return;
    state.loading=true;
    var btn=document.getElementById('refreshBtn');
    btn.textContent='Loading...';btn.disabled=true;
    document.getElementById('errorContainer').innerHTML='';
    try{
      var [w1,w2,rt]=await Promise.all([
        callHevyAPI('hevy.get_workouts',{page:1,pageSize:10}),
        callHevyAPI('hevy.get_workouts',{page:2,pageSize:10}),
        callHevyAPI('hevy.get_routines',{page:1,pageSize:10})
      ]);
      state.workouts=[...(w1.workouts||[]),...(w2.workouts||[])];
      state.routines=rt.routines||[];
      state.loaded=true;state.loading=false;
      btn.textContent='Refresh';btn.disabled=false;
      renderAll();
    }catch(e){
      console.error('Load failed:',e);
      document.getElementById('errorContainer').innerHTML='<div class="error-state">Failed to load: '+esc(e.message)+'</div>';
      state.loading=false;btn.textContent='Retry';btn.disabled=false;
    }
  };

  document.getElementById('refreshBtn').onclick=function(){loadData()};

  // ---- Render ----
  function renderAll(){
    if(!state.loaded)return;
    renderTopStats();
    renderWorkouts();
    renderRoutines();
    renderStatsTab();
  }

  function renderTopStats(){
    var ws=state.workouts;if(!ws.length)return;
    var now=new Date(),weekStart=getWeekStart(now);
    var thisWeek=ws.filter(function(w){return new Date(w.start_time)>=weekStart});
    var streak=0,check=new Date(weekStart);
    for(var i=0;i<12;i++){
      var s=new Date(check),e=new Date(check);e.setDate(e.getDate()+6);
      if(ws.some(function(w){var d=new Date(w.start_time);return d>=s&&d<=e}))streak++;else break;
      check.setDate(check.getDate()-7);
    }
    var avgMin=Math.round(ws.reduce(function(sum,w){return w.start_time&&w.end_time?sum+(new Date(w.end_time)-new Date(w.start_time))/60000:sum},0)/ws.length);

    document.getElementById('statTotal').textContent=ws.length;
    document.getElementById('statWeek').textContent=thisWeek.length;
    document.getElementById('statStreak').textContent=streak+'w';
    document.getElementById('statAvg').textContent=avgMin>0?avgMin+'m':'-';
  }

  function renderWorkouts(){
    var c=document.getElementById('workoutsContainer');
    var ws=state.workouts.slice(0,12);
    if(!ws.length){c.innerHTML='<div class="empty-state">No workouts found</div>';return}
    c.innerHTML=ws.map(function(w){
      var dt=new Date(w.start_time).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      var dur=formatDuration(w.start_time,w.end_time);
      var exs=w.exercises||[];
      var vol=calculateVolume(w);
      return '<div class="card" onclick="this.classList.toggle(\'expanded\')">'
        +'<div class="workout-header"><span class="workout-title">'+esc(w.title)+'</span><span class="workout-date">'+dt+'</span></div>'
        +'<div class="workout-meta"><span>'+dur+'</span><span>'+exs.length+' exercises</span><span>'+vol.toLocaleString()+'kg vol</span></div>'
        +'<div class="workout-exercises"><table class="exercise-table"><thead><tr><th>Exercise</th><th>Sets</th><th>Best Set</th></tr></thead><tbody>'
        +exs.map(function(ex){
          var sets=ex.sets||[];
          var best=sets.reduce(function(b,s){return s.weight_kg>b.w?{w:s.weight_kg,r:s.reps}:b},{w:0,r:0});
          return '<tr><td>'+esc(ex.title)+'</td><td>'+sets.length+'</td><td>'+(best.w?best.r+'x'+formatWeight(best.w):'-')+'</td></tr>';
        }).join('')
        +'</tbody></table></div>'
        +'<div class="expand-hint">click to expand</div></div>';
    }).join('');
  }

  function renderRoutines(){
    var c=document.getElementById('routinesContainer');
    var rs=state.routines.slice(0,8);
    if(!rs.length){c.innerHTML='<div class="empty-state">No routines found</div>';return}
    c.innerHTML=rs.map(function(r){
      var exCount=r.exercises?r.exercises.length:0;
      return '<div class="routine-card">'
        +'<div class="routine-name">'+esc(r.title)+'</div>'
        +'<div class="routine-meta"><span>'+exCount+' exercises</span></div>'
        +'</div>';
    }).join('');
  }

  function renderStatsTab(){
    var ws=state.workouts;if(!ws.length)return;
    var now=new Date(),weekStart=getWeekStart(now);
    var monthStart=new Date(now.getFullYear(),now.getMonth(),1);
    var thisWeek=ws.filter(function(w){return new Date(w.start_time)>=weekStart});
    var thisMonth=ws.filter(function(w){return new Date(w.start_time)>=monthStart});
    var totalVol=ws.reduce(function(s,w){return s+calculateVolume(w)},0);
    var avgEx=Math.round(ws.reduce(function(s,w){return s+(w.exercises?w.exercises.length:0)},0)/ws.length);

    document.getElementById('statsOverview').innerHTML=
      '<div class="stat-card"><div class="sv">'+ws.length+'</div><div class="sl">Total Workouts</div></div>'
      +'<div class="stat-card"><div class="sv">'+thisWeek.length+'</div><div class="sl">This Week</div></div>'
      +'<div class="stat-card"><div class="sv">'+thisMonth.length+'</div><div class="sl">This Month</div></div>'
      +'<div class="stat-card"><div class="sv">'+(totalVol>1000?(totalVol/1000).toFixed(0)+'k':totalVol)+'</div><div class="sl">Total Vol (kg)</div></div>'
      +'<div class="stat-card"><div class="sv">'+avgEx+'</div><div class="sl">Avg Exercises</div></div>';

    // Volume chart
    var weeks=[];
    for(var i=7;i>=0;i--){
      var s=new Date(weekStart);s.setDate(s.getDate()-i*7);
      var e=new Date(s);e.setDate(e.getDate()+6);
      var ww=ws.filter(function(w){var d=new Date(w.start_time);return d>=s&&d<=e});
      var tv=ww.reduce(function(sum,w){return sum+calculateVolume(w)},0);
      weeks.push({volume:tv,label:s.toLocaleDateString('en-US',{month:'short',day:'numeric'})});
    }
    var maxV=Math.max.apply(null,weeks.map(function(w){return w.volume}))||1;
    document.getElementById('volumeChart').innerHTML='<div class="volume-chart" style="margin-bottom:24px">'
      +weeks.map(function(w){
        var h=Math.max(4,w.volume/maxV*100);
        var vt=w.volume>1000?(w.volume/1000).toFixed(1)+'k':w.volume.toString();
        return '<div class="volume-bar" style="height:'+h+'px" data-week="'+w.label+'" data-volume="'+vt+'kg"></div>';
      }).join('')+'</div>';

    // Muscle groups
    var muscleMap={'squat':['Quads','Glutes'],'bench':['Chest','Triceps'],'deadlift':['Back','Hamstrings'],'press':['Shoulders'],'row':['Back'],'curl':['Biceps'],'pull':['Back','Biceps'],'fly':['Chest'],'raise':['Shoulders'],'extension':['Triceps']};
    var groups={};
    ws.slice(0,10).forEach(function(w){(w.exercises||[]).forEach(function(ex){
      var t=ex.title.toLowerCase();
      Object.keys(muscleMap).forEach(function(k){if(t.includes(k))muscleMap[k].forEach(function(m){groups[m]=(groups[m]||0)+(ex.sets?ex.sets.length:0)})});
    })});
    var mgEl=document.getElementById('muscleGroups');
    var sorted=Object.entries(groups).sort(function(a,b){return b[1]-a[1]}).slice(0,6);
    if(!sorted.length){mgEl.innerHTML='<div class="empty-state">No muscle data</div>';return}
    var maxC=Math.max.apply(null,sorted.map(function(s){return s[1]}));
    mgEl.innerHTML=sorted.map(function(s){
      return '<div class="muscle-item"><span class="muscle-name">'+s[0]+'</span><div class="muscle-bar-track"><div class="muscle-bar-fill" style="width:'+Math.round(s[1]/maxC*100)+'%"></div></div><span class="muscle-count">'+s[1]+'</span></div>';
    }).join('');

    // PRs
    var prs={};
    ws.forEach(function(w){(w.exercises||[]).forEach(function(ex){(ex.sets||[]).forEach(function(s){
      if(s.reps&&s.weight_kg&&s.reps<=5){
        if(!prs[ex.title]||s.weight_kg>prs[ex.title].weight)prs[ex.title]={weight:s.weight_kg,reps:s.reps,date:w.start_time};
      }
    })})});
    var prSorted=Object.entries(prs).sort(function(a,b){return b[1].weight-a[1].weight}).slice(0,8);
    var prEl=document.getElementById('prList');
    if(!prSorted.length){prEl.innerHTML='<div class="empty-state">No PR data</div>';return}
    prEl.innerHTML=prSorted.map(function(p){
      var dt=new Date(p[1].date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      var isNew=new Date(p[1].date)>new Date(Date.now()-7*86400000);
      return '<div class="pr-item"><span class="pr-exercise">'+esc(p[0])+'</span><span class="pr-weight">'+formatWeight(p[1].weight)+'</span><span class="pr-date">'+dt+'</span>'+(isNew?'<span class="pr-badge">NEW</span>':'')+'</div>';
    }).join('');
  }

  // ---- Auto-load ----
  setTimeout(loadData,500);
})();
</script>
